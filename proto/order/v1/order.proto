syntax = "proto3";

package tradedrift.order.v1;

option go_package = "tradedrift/platform/api/gen/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────
// Enums
// ─────────────────────────────────────────────

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLING = 4;
  ORDER_STATUS_CANCELLED = 5;
}

// ─────────────────────────────────────────────
// Messages
// ─────────────────────────────────────────────

message Order {
  string id = 1;                     // UUIDv7
  string user_id = 2;
  string market_id = 3;              // e.g. "BTC-USDT"
  OrderSide side = 4;
  OrderType order_type = 5;
  string price = 6;                  // Decimal string, empty for MARKET orders
  string quantity = 7;               // Decimal string
  string filled_quantity = 8;        // Decimal string
  string remaining_quantity = 9;     // Decimal string
  OrderStatus status = 10;
  string idempotency_key = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateOrderRequest {
  string user_id = 1;
  string market_id = 2;
  OrderSide side = 3;
  OrderType order_type = 4;
  string price = 5;                  // Decimal string
  string quantity = 6;               // Decimal string
  string idempotency_key = 7;
}

message CreateOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  string market_id = 2;
  OrderSide side = 3;
  OrderStatus status = 4;
  int32 limit = 5;
  string cursor = 6;
  google.protobuf.Timestamp from = 7;
  google.protobuf.Timestamp to = 8;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_cursor = 2;
}

message CancelAllOrdersRequest {
  string market_id = 1;
}

message CancelAllOrdersResponse {
  int32 cancelled_count = 1;
}

// ─────────────────────────────────────────────
// Service Interface
// ─────────────────────────────────────────────

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelAllOrders(CancelAllOrdersRequest) returns (CancelAllOrdersResponse);
}
