global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'admin'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['admin:8085']

  - job_name: 'trade'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['trade:9090']

  - job_name: 'portfolio'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portfolio:9091']

  - job_name: 'liquidity-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['liquidity-engine:9090']

  - job_name: 'notification'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification:9092']
