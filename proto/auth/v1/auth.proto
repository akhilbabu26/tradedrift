syntax = "proto3";

package tradedrift.auth.v1;

option go_package = "tradedrift/platform/api/auth/v1;authv1";
import "google/protobuf/timestamp.proto";


service AuthService {
    // ==========================================
    // Public RPCs
    // ==========================================

    // Registers a new user account with status PENDING_VERIFICATION.
    // Does NOT create a wallet and does NOT return tokens — see VerifyEmail.
    rpc Register(RegisterRequest) returns (RegisterResponse);

    // Verifies the email using the provided OTP.
    // On success, activates the account and completes any required
    // account initialization before issuing authentication tokens.
    rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);

    // Resends a new email verification code (OTP) if expired or lost.
    rpc ResendVerificationCode(ResendVerificationCodeRequest) returns (ResendVerificationCodeResponse);

    // Authenticates credentials (username or email) and issues access + refresh
    // tokens. Requires status == VERIFIED.
    rpc Login(LoginRequest) returns (LoginResponse);

    // Rotates the refresh token to yield a new token pair.
    // Reuse of an already-rotated token revokes all sessions for that user.
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

    // Requests a password reset code. Always returns success regardless of
    // whether the email exists, to avoid user-enumeration.
    rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);

    // Validates the reset code and sets a new password. On success, revokes
    // all refresh tokens and blacklists all currently-issued access tokens for
    // the user.
    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

    // Authenticates a user using a Google ID token.
    // Handles brand new user signup, returning user login, or returns
    // an explicit LINK_REQUIRED status when a matching local email account exists.
    rpc GoogleLogin(GoogleLoginRequest) returns (GoogleLoginResponse);

    // Links a verified Google identity to an existing local password account
    // by validating password credentials alongside the short-lived link token.
    rpc LinkGoogleAccount(LinkGoogleAccountRequest) returns (LinkGoogleAccountResponse);

    // ==========================================
    // Authenticated RPCs (Requires JWT Context)
    // ==========================================

    // Revokes current session tokens based on the authenticated JWT context.
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // Revokes ALL sessions for the authenticated user across all devices.
    rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);

    // Changes password for the authenticated user and revokes all other sessions.
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

    // Connects a Google identity to the currently authenticated user's account.
    // Fails with ALREADY_EXISTS if the Google identity is already linked to an account.
    rpc ConnectGoogleAccount(ConnectGoogleAccountRequest) returns (ConnectGoogleAccountResponse);

    // ==========================================
    // Internal RPCs (Admin service only — no JWT required)
    // ==========================================

    // Revokes all active sessions for the specified user by user_id.
    // Called by the Admin service during user suspension. Idempotent.
    rpc InvalidateUserSessions(InvalidateUserSessionsRequest) returns (InvalidateUserSessionsResponse);

    // Suspends a user account and invalidates all active sessions.
    rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse);

    // Unsuspends a user account, restoring VERIFIED status.
    rpc UnsuspendUser(UnsuspendUserRequest) returns (UnsuspendUserResponse);

    // Lists suspended user IDs with bounded pagination for anti-drift reconciliation.
    rpc ListSuspendedUsers(ListSuspendedUsersRequest) returns (ListSuspendedUsersResponse);
}

// ==========================================
// Shared Messages
// ==========================================

message User {
    string user_id  = 1;
    string email    = 2;
    string username = 3;
}

// ==========================================
// Register / Verify / Resend
// ==========================================

message RegisterRequest {
    // Required. Must be a valid email format.
    string email    = 1;
    // Required. Must be between 3 and 32 characters, alphanumeric.
    string username = 2;
    // Required. Minimum 8 characters; must contain at least one letter and one number.
    string password = 3;
}

message RegisterResponse {
    // User is created with status PENDING_VERIFICATION.
    string user_id = 1;
    // Useful for future OAuth logic. True for V1 registration.
    bool verification_required = 2;
}


message VerifyEmailRequest {
    // Required. Must match the registered email address.
    string email = 1;
    // Required. Must be exactly a 6-digit numeric OTP code.
    string code  = 2;
}

message VerifyEmailResponse {
    User user                                 = 1;
    string access_token                       = 2;
    string refresh_token                      = 3;
    google.protobuf.Timestamp access_token_expires_at  = 4;
    google.protobuf.Timestamp refresh_token_expires_at = 5;
}


message ResendVerificationCodeRequest {
    // Required. Must be a valid email format.
    string email = 1;
}

message ResendVerificationCodeResponse {
    // Always true if the email exists and is still PENDING_VERIFICATION.
    // Does not distinguish "email not found" from "already verified" to avoid account leaking.
    bool success = 1;
}

// ==========================================
// Login / Refresh
// ==========================================

message LoginRequest {
    // Required. Can be the registered email or username.
    string identifier = 1;
    // Required. User password.
    string password   = 2;
}

message LoginResponse {
    User user                                 = 1;
    string access_token                       = 2;
    string refresh_token                      = 3;
    google.protobuf.Timestamp access_token_expires_at  = 4;
    google.protobuf.Timestamp refresh_token_expires_at = 5;
}


message RefreshTokenRequest {
    // Required. Secure, random 64-character opaque refresh token string.
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token                       = 1;
    string refresh_token                      = 2;
    google.protobuf.Timestamp access_token_expires_at  = 3;
    google.protobuf.Timestamp refresh_token_expires_at = 4;
}


// ==========================================
// Forgot / Reset Password
// ==========================================

message ForgotPasswordRequest {
    // Required. Email to send the reset code to, if it exists.
    string email = 1;
}

message ForgotPasswordResponse {
    // Always true — response is identical whether or not the email exists.
    bool success = 1;
}

message ResetPasswordRequest {
    // Required. Must match the email the reset code was issued to.
    string email        = 1;
    // Required. 6-digit numeric OTP code from the reset email.
    string code         = 2;
    // Required. New password. Same complexity rules as registration.
    string new_password = 3;
}

message ResetPasswordResponse {
    bool success = 1;
}

// ==========================================
// Logout / LogoutAll
// ==========================================

message LogoutRequest {
    string refresh_token = 1;
}

message LogoutResponse {
    bool success = 1;
}

// Empty body since the user is identified by the authenticated access token.
message LogoutAllRequest {}

message LogoutAllResponse {
    bool success = 1;
}

// ==========================================
// InvalidateUserSessions (internal — admin only)
// ==========================================

message InvalidateUserSessionsRequest {
    // Required. UUID of the user whose sessions will be revoked.
    string user_id = 1;
    // Optional. Human-readable reason for audit purposes.
    string reason  = 2;
}

message InvalidateUserSessionsResponse {
    bool success = 1;
}

// ==========================================
// Change Password
// ==========================================

message ChangePasswordRequest {
    // Required. Currently active password.
    string old_password = 1;
    // Required. New password. Same complexity rules as registration (min 8 chars, letter + number).
    string new_password = 2;
}

message ChangePasswordResponse {
    bool success = 1;
}

// ==========================================
// User Suspension (Internal — Admin only)
// ==========================================

message SuspendUserRequest {
    // Required. UUID of the user to suspend.
    string user_id = 1;
    // Optional. Reason for suspension.
    string reason  = 2;
}

message SuspendUserResponse {
    bool success = 1;
}

message UnsuspendUserRequest {
    // Required. UUID of the user to unsuspend.
    string user_id = 1;
    // Optional. Reason for unsuspension.
    string reason  = 2;
}

message UnsuspendUserResponse {
    bool success = 1;
}

message ListSuspendedUsersRequest {
    int32 limit  = 1;
    int32 offset = 2;
}

message ListSuspendedUsersResponse {
    repeated string user_ids = 1;
    int32 total              = 2;
}

// ==========================================
// Google OAuth & Account Linking
// ==========================================

enum GoogleLoginStatus {
    GOOGLE_LOGIN_STATUS_UNSPECIFIED = 0;
    GOOGLE_LOGIN_STATUS_SUCCESS = 1;
    GOOGLE_LOGIN_STATUS_LINK_REQUIRED = 2;
}

message GoogleLoginRequest {
    // Required. Raw Google ID Token (JWT) issued by Google Identity Services.
    string id_token = 1;
}

message GoogleLoginResponse {
    GoogleLoginStatus status = 1;

    // Populated when status == GOOGLE_LOGIN_STATUS_SUCCESS
    User user = 2;
    string access_token = 3;
    string refresh_token = 4;
    google.protobuf.Timestamp access_token_expires_at = 5;
    google.protobuf.Timestamp refresh_token_expires_at = 6;

    // Populated when status == GOOGLE_LOGIN_STATUS_LINK_REQUIRED
    // Short-lived signed link token proving possession of the verified Google identity.
    string link_token = 7;
    // Email associated with the Google identity requiring password confirmation.
    string email = 8;
    // Explanatory message for UI presentation.
    string message = 9;
}

message LinkGoogleAccountRequest {
    // Required. Email of the existing TradeDrift local account.
    string email = 1;
    // Required. Password of the existing TradeDrift local account.
    string password = 2;
    // Required. Short-lived link token returned when GoogleLogin status was LINK_REQUIRED.
    string link_token = 3;
}

message LinkGoogleAccountResponse {
    User user = 1;
    string access_token = 2;
    string refresh_token = 3;
    google.protobuf.Timestamp access_token_expires_at = 4;
    google.protobuf.Timestamp refresh_token_expires_at = 5;
}

message ConnectGoogleAccountRequest {
    // Required. Raw Google ID Token (JWT) issued by Google Identity Services.
    string id_token = 1;
}

message ConnectGoogleAccountResponse {
    bool success = 1;
    string provider = 2;
    string email = 3;
}
