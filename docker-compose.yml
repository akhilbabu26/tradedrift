services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: tradedrift-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: tradedrift-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # ─── Microservices ─────────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: tradedrift-auth
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_auth?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: super-secret-jwt-key-tradedrift-dev-32bytes
      PORT: ":50051"
      MIGRATIONS_DIR: services/auth/migrations
      WALLET_ADDR: wallet:50052
      LOG_LEVEL: info
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
      wallet:
        condition: service_started

  wallet:
    build:
      context: .
      dockerfile: services/wallet/Dockerfile
    container_name: tradedrift-wallet
    restart: unless-stopped
    deploy:
      replicas: 1 # SINGLETON: Maintain 1 active instance in V1 for deterministic outbox publisher order
    environment:
      WALLET_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_wallet?sslmode=disable
      WALLET_PORT: ":50052"
      WALLET_MIGRATIONS_DIR: services/wallet/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_TRADE_SETTLED: trades.settled.v1
      KAFKA_TOPIC_PORTFOLIO_USER_TRADES: portfolio.user.trades.v1
      LOG_LEVEL: info
    ports:
      - "50052:50052"
    depends_on:
      kafka:
        condition: service_started

  wallet-topup:
    build:
      context: .
      dockerfile: services/wallet-topup/Dockerfile
    container_name: tradedrift-wallet-topup
    restart: unless-stopped
    environment:
      PORT: "8084"
      POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_topup?sslmode=disable
      WALLET_GRPC_ADDR: wallet:50052
      DAILY_LIMIT_INR: "10"
      WEBHOOK_SECRET: topup_mock_secret_key_12345
    ports:
      - "8084:8084"
    depends_on:
      wallet:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    container_name: tradedrift-admin
    restart: unless-stopped
    environment:
      PORT: "8085"
      POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_admin?sslmode=disable
      AUTH_GRPC_ADDR: auth:50051
      WALLET_GRPC_ADDR: wallet:50052
      JWT_SECRET: super-secret-jwt-key-tradedrift-dev-32bytes
      KAFKA_BROKERS: kafka:29092
      TRADE_HEALTH_URL: http://trade:9090/ready
      PORTFOLIO_HEALTH_URL: http://portfolio:9091/ready
      LIQUIDITY_HEALTH_URL: http://liquidity-engine:8080/readyz
      NOTIFICATION_HEALTH_URL: http://notification:9092/ready
      LOG_LEVEL: info
      OUTBOX_INTERVAL: 1s
      SAGA_INTERVAL: 5s
      HEALTH_INTERVAL: 15s
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_started
      auth:
        condition: service_started
      wallet:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: tradedrift-order
    restart: unless-stopped
    environment:
      ORDER_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_order?sslmode=disable
      ORDER_GRPC_PORT: ":50053"
      ORDER_MIGRATIONS_DIR: services/order/migration
      WALLET_GRPC_ADDR: wallet:50052
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      MAX_PRICE_DEVIATION_PERCENT: "0.05"
      LOG_LEVEL: info
    ports:
      - "50053:50053"
    depends_on:
      wallet:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  market:
    build:
      context: .
      dockerfile: services/market/Dockerfile
    container_name: tradedrift-market
    restart: unless-stopped
    environment:
      MARKET_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_market?sslmode=disable
      MARKET_GRPC_PORT: ":50054"
      MARKET_MIGRATIONS_DIR: services/market/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: market-service-group
      KAFKA_TOPIC_TRADE_EXECUTED: trades.executed
      LOG_LEVEL: info
    ports:
      - "50054:50054"
    depends_on:
      kafka:
        condition: service_started

  matching-engine:
    build:
      context: .
      dockerfile: services/matching-engine/Dockerfile
    container_name: tradedrift-matching-engine
    restart: unless-stopped
    deploy:
      replicas: 1 # SINGLETON: Sequential order processing requires single active instance per market partition
    environment:
      POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_matching?sslmode=disable
      ME_MIGRATIONS_DIR: services/matching-engine/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: matching-engine
      REDIS_ADDR: redis:6379
      HTTP_PORT: "8082"
      BTC_PARTITION: 0
      ETH_PARTITION: 1
      SOL_PARTITION: 2
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  settlement:
    build:
      context: .
      dockerfile: services/settlement/Dockerfile
    container_name: tradedrift-settlement
    restart: unless-stopped
    environment:
      SETTLEMENT_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_settlement?sslmode=disable
      SETTLEMENT_MIGRATIONS_DIR: services/settlement/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: settlement-service-group-v2
      KAFKA_TOPIC_TRADE_EXECUTED: trades.executed
      WALLET_GRPC_ADDR: wallet:50052
      WALLET_GRPC_TIMEOUT: 5s
      LOG_LEVEL: info
    depends_on:
      kafka:
        condition: service_started
      wallet:
        condition: service_started


  trade:
    build:
      context: .
      dockerfile: services/trade/Dockerfile
    container_name: tradedrift-trade
    restart: unless-stopped
    environment:
      TRADE_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_trade?sslmode=disable
      TRADE_MIGRATIONS_DIR: services/trade/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: trade-service-group
      KAFKA_TOPIC_TRADE_SETTLED: trades.settled.v1
      KAFKA_TOPIC_TRADE_DLQ: trades.settled.dlq
      TRADE_GRPC_PORT: ":50057"
      TRADE_METRICS_PORT: ":9090"
      LOG_LEVEL: info
    ports:
      - "50057:50057"
      - "9090:9090"
    depends_on:
      kafka:
        condition: service_started

  portfolio:
    build:
      context: .
      dockerfile: services/portfolio/Dockerfile
    container_name: tradedrift-portfolio
    restart: unless-stopped
    deploy:
      replicas: 1 # SINGLETON: Maintain 1 active instance in V1 for deterministic outbox publisher order
    environment:
      PORTFOLIO_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_portfolio?sslmode=disable
      PORTFOLIO_MIGRATIONS_DIR: services/portfolio/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: portfolio-service-group
      KAFKA_TOPIC_PORTFOLIO_USER_TRADES: portfolio.user.trades.v1
      KAFKA_TOPIC_PORTFOLIO_UPDATED: portfolios.updated.v1
      KAFKA_TOPIC_TRADE_DLQ: trades.settled.dlq
      WALLET_GRPC_ADDR: wallet:50052
      MARKET_GRPC_ADDR: market:50054
      PORTFOLIO_GRPC_PORT: ":50058"
      PORTFOLIO_METRICS_PORT: ":9091"
      LOG_LEVEL: info
    ports:
      - "50058:50058"
      - "9091:9091"
    depends_on:
      kafka:
        condition: service_started
      wallet:
        condition: service_started
      market:
        condition: service_started

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: tradedrift-notification
    restart: unless-stopped
    environment:
      NOTIFICATION_POSTGRES_DSN: postgres://postgres:123@host.docker.internal:5432/tradedrift_notification?sslmode=disable
      NOTIFICATION_MIGRATIONS_DIR: services/notification/migration
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      NOTIFICATION_KAFKA_GROUP_ID: notification-service-group
      NOTIFICATION_DLQ_TOPIC: notifications.dlq
      NOTIFICATION_GRPC_PORT: ":50059"
      NOTIFICATION_METRICS_PORT: ":9092"
      LOG_LEVEL: info
    ports:
      - "50059:50059"
      - "9095:9092"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: tradedrift-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: ":8080"
      AUTH_ADDR:    "auth:50051"
      WALLET_ADDR:  "wallet:50052"
      ORDER_ADDR:   "order:50053"
      MARKET_ADDR:  "market:50054"
      TRADE_ADDR:   "trade:50057"
      PORTFOLIO_ADDR: "portfolio:50058"
      NOTIFICATION_ADDR: "notification:50059"
      REDIS_ADDR:   "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      JWT_SECRET:   "super-secret-jwt-key-tradedrift-dev-32bytes"
      CORS_ORIGIN:  "http://localhost:5173"
      LOG_LEVEL:    "info"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      auth:
        condition: service_started
      wallet:
        condition: service_started
      order:
        condition: service_started
      market:
        condition: service_started
      trade:
        condition: service_started
      matching-engine:
        condition: service_started
      portfolio:
        condition: service_started
      notification:
        condition: service_started

  liquidity-engine:
    build:
      context: .
      dockerfile: services/liquidity-engine/Dockerfile
    container_name: tradedrift-liquidity-engine
    restart: unless-stopped
    deploy:
      replicas: 1 # MUST run as singleton (replicas: 1). Horizontal scaling is prohibited in V1.
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: liquidity-engine-group
      WALLET_GRPC_ADDR: wallet:50052
      ORDER_GRPC_ADDR: order:50053
      ME_HTTP_ADDR: http://matching-engine:8082
      BTC_PARTITION: 0
      ETH_PARTITION: 1
      SOL_PARTITION: 2
      BTC_REFERENCE_PRICE: "96450.00"
      ETH_REFERENCE_PRICE: "2780.50"
      SOL_REFERENCE_PRICE: "188.20"
      RECONCILE_INTERVAL: "30s"
      WALLET_REFRESH_INTERVAL: "15s"
      MAX_BALANCE_STALENESS: "60s"
      PENDING_TIMEOUT: "10s"
      CANCELLING_TIMEOUT: "30s"
      CANCEL_RETRY_LIMIT: 3
      ME_LIVENESS_THRESHOLD: 3
      HEALTH_PORT: "8080"
      METRICS_PORT: "9090"
    ports:
      - "8081:8080"
      - "9094:9090" # Host port 9094 mapped to container 9090 (avoids collision with portfolio's 9091)
    depends_on:
      kafka:
        condition: service_started
      wallet:
        condition: service_started
      order:
        condition: service_started
      matching-engine:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tradedrift-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - admin

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tradedrift-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

