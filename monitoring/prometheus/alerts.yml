groups:
  - name: tradedrift-admin-alerts
    rules:
      - alert: AdminSagaTaskExhausted
        expr: increase(tradedrift_admin_saga_tasks_total{result="EXHAUSTED"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: admin
        annotations:
          summary: "Admin Saga Task Exhausted: Immediate Manual Intervention Required"
          description: "An administrative saga task (e.g. Auth session invalidation) has exceeded all retry attempts and failed permanently."

      - alert: AdminOutboxBacklogSpike
        expr: tradedrift_admin_outbox_backlog_depth > 50 or tradedrift_admin_outbox_oldest_unpublished_seconds > 120
        for: 2m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "Admin Outbox Backlog Spike or Lag Detected"
          description: "Admin outbox events backlog is > 50 or oldest event unpublished age exceeds 120s."

      - alert: AdminServiceDown
        expr: up{job="admin"} == 0 or absent(up{job="admin"}) == 1
        for: 1m
        labels:
          severity: critical
          service: admin
        annotations:
          summary: "TradeDrift Admin Service is Down"
          description: "Prometheus cannot scrape TradeDrift Admin Service at admin:8085."

      - alert: CriticalDependencyDown
        expr: tradedrift_admin_system_overall_status == 0
        for: 1m
        labels:
          severity: critical
          service: admin
        annotations:
          summary: "TradeDrift Critical Dependency Down"
          description: "Platform overall status has fallen to UNHEALTHY due to a core dependency outage (Auth, Wallet, Trade, Portfolio, Liquidity Engine, or Postgres)."

      - alert: AdminHealthProbeStale
        expr: time() - tradedrift_admin_health_probe_last_run_timestamp_seconds > 60
        for: 1m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "Admin Health Probe Stale (HealthWorker not reporting)"
          description: "The background HealthWorker has not successfully recorded a health probe run in the last 60 seconds."

      - alert: HighAdminErrorRate
        expr: (sum(rate(tradedrift_admin_http_requests_total{status=~"5.."}[5m])) / sum(rate(tradedrift_admin_http_requests_total[5m])) > 0.05) and (sum(rate(tradedrift_admin_http_requests_total[5m])) > 0)
        for: 5m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "High Admin HTTP 5xx Error Rate (> 5%)"
          description: "Admin service HTTP 5xx error responses represent more than 5% of all traffic over the last 5 minutes."

      # ─── Phase 3: Advanced Operational & Anomaly Alerts ──────────────────────────

      - alert: MassUserSuspensionAnomaly
        expr: increase(tradedrift_admin_operations_total{operation_type="SUSPEND_USER",status="SUCCESS"}[10m]) >= 5
        for: 1m
        labels:
          severity: critical
          service: admin
          category: anomaly
        annotations:
          summary: "Mass User Suspension Anomaly Detected"
          description: "Over 5 user suspension operations have succeeded within a 10-minute window. Verify operator authorization immediately."

      - alert: MassWalletFreezeAnomaly
        expr: increase(tradedrift_admin_operations_total{operation_type="FREEZE_WALLET",status="SUCCESS"}[10m]) >= 5
        for: 1m
        labels:
          severity: critical
          service: admin
          category: anomaly
        annotations:
          summary: "Mass Wallet Freeze Anomaly Detected"
          description: "Over 5 wallet freeze operations have succeeded within a 10-minute window. Inspect admin audit logs for account security."

      - alert: ExtendedMarketHaltWarning
        expr: (tradedrift_admin_market_halt_status == 1) and ((time() - tradedrift_admin_market_halt_start_timestamp_seconds) > 1800)
        for: 2m
        labels:
          severity: warning
          service: admin
          category: market_operations
        annotations:
          summary: "Extended Market Halt Warning (> 30m): {{ $labels.market_id }}"
          description: "Market {{ $labels.market_id }} has remained in a HALTED state for over 30 minutes without resumption."

      - alert: CascadingDependencyOutage
        expr: count(tradedrift_admin_service_health_status{status="DOWN"} == 1) >= 2
        for: 1m
        labels:
          severity: critical
          service: admin
          category: platform_resilience
        annotations:
          summary: "Cascading Dependency Outage: Multiple Core Services Down"
          description: "Two or more platform services are reporting DOWN status simultaneously, indicating a cluster or network failure."

      - alert: AdminAPIHighErrorBudgetBurnRate
        expr: (
            sum(rate(tradedrift_admin_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(tradedrift_admin_http_requests_total[5m])), 0.001)
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          service: admin
          category: slo_burn_rate
        annotations:
          summary: "Admin API 1-Hour SLO Burn Rate Exceeded (14.4x)"
          description: "Admin Service 5xx error budget is burning at 14.4x normal rate over 5 minutes (consuming >2% of monthly error budget in 1 hour)."

  - name: tradedrift-controlled-taker-alerts
    rules:
      - alert: ControlledTakerServiceDown
        expr: up{job="controlled-taker"} == 0 or absent(up{job="controlled-taker"}) == 1
        for: 1m
        labels:
          severity: critical
          service: controlled-taker
        annotations:
          summary: "TradeDrift Controlled Taker Service is Down"
          description: "Prometheus cannot scrape TradeDrift Controlled Taker Service at controlled-taker:9090."

      - alert: ControlledTakerUnresolvedResidual
        expr: increase(cts_unresolved_residuals_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: controlled-taker
        annotations:
          summary: "Controlled Taker Unresolved Residual Order Detected"
          description: "A partially filled or unverified taker order could not be confirmed cancelled. Potential resting maker order risk."

      - alert: ControlledTakerCircuitBreakerTripped
        expr: increase(cts_circuit_breaker_tripped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: controlled-taker
        annotations:
          summary: "Controlled Taker Circuit Breaker Tripped"
          description: "Circuit breaker has tripped for market {{ $labels.market_id }} due to consecutive order failures or depth anomalies."

      - alert: ControlledTakerHighDepthReadErrors
        expr: increase(cts_depth_read_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: controlled-taker
        annotations:
          summary: "High Rate of Depth Read / Validation Errors in Controlled Taker"
          description: "Controlled Taker Service is observing frequent depth errors for market {{ $labels.market_id }} (reason: {{ $labels.reason }})."

