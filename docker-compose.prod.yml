services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: tradedrift-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradedrift_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?FATAL: POSTGRES_PASSWORD must be set in production}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
    networks:
      - tradedrift-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradedrift_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tradedrift-redis-prod
    restart: always
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
             else
               redis-server --appendonly yes;
             fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - tradedrift-prod-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: tradedrift-kafka-prod
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - tradedrift-prod-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: tradedrift-kafka-init-prod
    restart: "no"
    environment:
      KAFKA_ADDR: kafka:29092
    volumes:
      - ./scripts/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    entrypoint: ["/bin/sh", "/kafka-init-topics.sh"]
    networks:
      - tradedrift-prod-net
    depends_on:
      kafka:
        condition: service_healthy

  migration:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: tradedrift-migration-prod
    restart: "no"
    environment:
      ENV: production
      APP_ENV: production
      AUTH_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_auth?sslmode=disable
      WALLET_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_wallet?sslmode=disable
      MARKET_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_market?sslmode=disable
      ORDER_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_order?sslmode=disable
      MATCHING_ENGINE_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_matching?sslmode=disable
      SETTLEMENT_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_settlement?sslmode=disable
      TRADE_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_trade?sslmode=disable
      PORTFOLIO_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_portfolio?sslmode=disable
      NOTIFICATION_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_notification?sslmode=disable
      ADMIN_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_admin?sslmode=disable
      WALLET_TOPUP_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_topup?sslmode=disable
    command: ["-service=all", "-action=up", "-strict"]
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Microservices ─────────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: tradedrift-auth-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_auth?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: "${JWT_SECRET:?FATAL: JWT_SECRET must be set in production}"
      PORT: ":50051"
      MIGRATIONS_DIR: services/auth/migrations
      WALLET_ADDR: wallet:50052
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  wallet:
    build:
      context: .
      dockerfile: services/wallet/Dockerfile
    container_name: tradedrift-wallet-prod
    restart: always
    deploy:
      replicas: 1
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      WALLET_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_wallet?sslmode=disable
      WALLET_PORT: ":50052"
      WALLET_MIGRATIONS_DIR: services/wallet/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_TRADE_SETTLED: trades.settled.v1
      KAFKA_TOPIC_PORTFOLIO_USER_TRADES: portfolio.user.trades.v1
      OUTBOX_IDLE_INTERVAL: "200ms"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  wallet-topup:
    build:
      context: .
      dockerfile: services/wallet-topup/Dockerfile
    container_name: tradedrift-wallet-topup-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      PORT: "8084"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_topup?sslmode=disable
      WALLET_GRPC_ADDR: wallet:50052
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?FATAL: WEBHOOK_SECRET must be set in production}"
      DAILY_LIMIT_INR: ${DAILY_LIMIT_INR:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      wallet:
        condition: service_started
      migration:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    container_name: tradedrift-admin-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      ADMIN_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_admin?sslmode=disable
      AUTH_GRPC_ADDR: auth:50051
      WALLET_GRPC_ADDR: wallet:50052
      JWT_SECRET: "${JWT_SECRET:?FATAL: JWT_SECRET must be set in production}"
      KAFKA_BROKERS: kafka:29092
      TRADE_HEALTH_URL: http://trade:9090/ready
      PORTFOLIO_HEALTH_URL: http://portfolio:9091/ready
      LIQUIDITY_HEALTH_URL: http://liquidity-engine:8080/readyz
      NOTIFICATION_HEALTH_URL: http://notification:9092/ready
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8085"
      ADMIN_MIGRATIONS_DIR: services/admin/migrations
      REDIS_ADDR: redis:6379
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: tradedrift-order-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      ORDER_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_order?sslmode=disable
      ORDER_GRPC_PORT: ":50053"
      ORDER_MIGRATIONS_DIR: services/order/migration
      WALLET_GRPC_ADDR: wallet:50052
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      KAFKA_TOPIC_ORDER_COMMANDS: orders.commands
      KAFKA_TOPIC_ORDER_EVENTS: orders.events
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  market:
    build:
      context: .
      dockerfile: services/market/Dockerfile
    container_name: tradedrift-market-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      MARKET_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_market?sslmode=disable
      MARKET_GRPC_PORT: ":50054"
      MARKET_MIGRATIONS_DIR: services/market/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_ORDER_EVENTS: orders.events
      KAFKA_TOPIC_TRADE_EXECUTED: trades.executed
      REDIS_ADDR: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  matching-engine:
    build:
      context: .
      dockerfile: services/matching-engine/Dockerfile
    container_name: tradedrift-matching-engine-prod
    restart: always
    deploy:
      replicas: 1
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_matching?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_ORDERS_COMMANDS_TOPIC: orders.commands
      KAFKA_TRADES_EXECUTED_TOPIC: trades.executed
      REDIS_ADDR: redis:6379
      HTTP_PORT: "8082"
      GRPC_PORT: "50055"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      RECONCILIATION_ADMIN_SECRET: "${RECONCILIATION_ADMIN_SECRET:?FATAL: RECONCILIATION_ADMIN_SECRET must be set in production}"
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  settlement:
    build:
      context: .
      dockerfile: services/settlement/Dockerfile
    container_name: tradedrift-settlement-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      SETTLEMENT_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_settlement?sslmode=disable
      SETTLEMENT_MIGRATIONS_DIR: services/settlement/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: settlement-service-group
      KAFKA_TOPIC_TRADE_EXECUTED: trades.executed
      WALLET_GRPC_ADDR: wallet:50052
      WALLET_GRPC_TIMEOUT: 5s
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      wallet:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  trade:
    build:
      context: .
      dockerfile: services/trade/Dockerfile
    container_name: tradedrift-trade-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      TRADE_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_trade?sslmode=disable
      TRADE_MIGRATIONS_DIR: services/trade/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: trade-service-group
      KAFKA_TOPIC_TRADE_SETTLED: trades.settled.v1
      KAFKA_TOPIC_TRADE_DLQ: trades.settled.dlq
      TRADE_GRPC_PORT: ":50057"
      TRADE_METRICS_PORT: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  portfolio:
    build:
      context: .
      dockerfile: services/portfolio/Dockerfile
    container_name: tradedrift-portfolio-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      PORTFOLIO_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_portfolio?sslmode=disable
      PORTFOLIO_MIGRATIONS_DIR: services/portfolio/migration
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: portfolio-service-group
      KAFKA_TOPIC_PORTFOLIO_USER_TRADES: portfolio.user.trades.v1
      KAFKA_TOPIC_PORTFOLIO_UPDATED: portfolios.updated.v1
      KAFKA_TOPIC_TRADE_DLQ: trades.settled.dlq
      WALLET_GRPC_ADDR: wallet:50052
      MARKET_GRPC_ADDR: market:50054
      PORTFOLIO_GRPC_PORT: ":50058"
      PORTFOLIO_METRICS_PORT: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: tradedrift-notification-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      AUTO_MIGRATE: "false"
      NOTIFICATION_POSTGRES_DSN: postgres://${POSTGRES_USER:-tradedrift_admin}:${POSTGRES_PASSWORD}@postgres:5432/tradedrift_notification?sslmode=disable
      NOTIFICATION_MIGRATIONS_DIR: services/notification/migration
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      NOTIFICATION_KAFKA_GROUP_ID: notification-service-group
      NOTIFICATION_DLQ_TOPIC: notifications.dlq
      NOTIFICATION_GRPC_PORT: ":50059"
      NOTIFICATION_METRICS_PORT: ":9092"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - tradedrift-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: tradedrift-gateway-prod
    restart: always
    environment:
      ENV: production
      APP_ENV: production
      GATEWAY_PORT: ":8080"
      AUTH_ADDR: "auth:50051"
      WALLET_ADDR: "wallet:50052"
      ORDER_ADDR: "order:50053"
      MARKET_ADDR: "market:50054"
      TRADE_ADDR: "trade:50057"
      PORTFOLIO_ADDR: "portfolio:50058"
      NOTIFICATION_ADDR: "notification:50059"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      JWT_SECRET: "${JWT_SECRET:?FATAL: JWT_SECRET must be set in production}"
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGINS:-https://tradedrift-frontend.vercel.app}
      GATEWAY_RATE_LIMIT_RPS: "${GATEWAY_RATE_LIMIT_RPS:-50}"
      GATEWAY_RATE_LIMIT_BURST: "${GATEWAY_RATE_LIMIT_BURST:-100}"
      TOPUP_ADDR: "http://wallet-topup:8084"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Binds strictly to host 127.0.0.1 so reverse proxy (Nginx) can forward traffic
      # Prevents direct internet access bypassing TLS and host security groups
      - "127.0.0.1:8080:8080"
    networks:
      - tradedrift-prod-net
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      wallet:
        condition: service_started
      order:
        condition: service_started
      market:
        condition: service_started
      trade:
        condition: service_started
      matching-engine:
        condition: service_started
      portfolio:
        condition: service_started
      notification:
        condition: service_started

  liquidity-engine:
    build:
      context: .
      dockerfile: services/liquidity-engine/Dockerfile
    container_name: tradedrift-liquidity-engine-prod
    restart: always
    deploy:
      replicas: 1
    environment:
      ENV: production
      APP_ENV: production
      WALLET_GRPC_ADDR: wallet:50052
      ORDER_GRPC_ADDR: order:50053
      ME_HTTP_ADDR: http://matching-engine:8082
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_TRADE_EXECUTED: trades.executed
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      SPREAD_BPS: "10"
      ORDER_LEVELS: "5"
      LEVEL_SPACING_BPS: "5"
      BASE_ORDER_SIZE_BTC: "0.1"
      BASE_ORDER_SIZE_ETH: "1.0"
      BASE_ORDER_SIZE_SOL: "10.0"
      QUOTE_CURRENCY: "USDT"
      INITIAL_PRICES: "BTC:65000,ETH:3500,SOL:150"
      MAX_INVENTORY_SKEW_RATIO: "0.8"
      WALLET_REFRESH_INTERVAL: "5s"
      MM_USER_ID: "00000000-0000-0000-0000-000000000001"
      REFILL_USDT_THRESHOLD: "50000"
      REFILL_USDT_AMOUNT: "500000"
      REFILL_CRYPTO_THRESHOLD_RATIO: "0.1"
      REFILL_CRYPTO_AMOUNT_RATIO: "1.0"
      DEFAULT_BTC_PRICE: "65000"
      DEFAULT_ETH_PRICE: "3500"
      DEFAULT_SOL_PRICE: "150"
      PRICE_FETCH_TIMEOUT: "2s"
      PRICE_UPDATE_INTERVAL: "1s"
      ORDER_UPDATE_INTERVAL: "1s"
      LE_ORDER_LIFETIME: "3m"
      MIN_SPREAD_TICKS: "2"
      HEALTH_PORT: "8080"
      METRICS_PORT: "9090"
    networks:
      - tradedrift-prod-net
    depends_on:
      order:
        condition: service_started
      wallet:
        condition: service_started
      matching-engine:
        condition: service_started

  controlled-taker:
    build:
      context: .
      dockerfile: services/controlled-taker/Dockerfile
    container_name: tradedrift-controlled-taker-prod
    restart: always
    deploy:
      replicas: 1
    environment:
      ENV: production
      APP_ENV: production
      ORDER_GRPC_ADDR: order:50053
      REDIS_ADDR: redis:6379
      MAX_ORDER_NOTIONAL_USDT: "10000.00"
      CT_USER_ID: "00000000-0000-0000-0000-000000000002"
      ACTIVE_MARKETS: "BTC-USDT,ETH-USDT,SOL-USDT"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      TICK_INTERVAL: "2s"
      MIN_SPREAD_PCT: "0.0005"
      HEALTH_PORT: "8080"
      METRICS_PORT: "9090"
    networks:
      - tradedrift-prod-net
    depends_on:
      order:
        condition: service_started
      market:
        condition: service_started
      portfolio:
        condition: service_started

  # ─── Observability (Private Internal) ──────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tradedrift-prometheus-prod
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - tradedrift-prod-net
    depends_on:
      gateway:
        condition: service_started

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tradedrift-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?FATAL: GF_SECURITY_ADMIN_PASSWORD must be set in production}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Binds strictly to 127.0.0.1 on the host for SSH-tunnel access (ssh -L 3000:localhost:3000)
      - "127.0.0.1:3000:3000"
    networks:
      - tradedrift-prod-net
    depends_on:
      - prometheus

# ─── Networks & Volumes ────────────────────────────────────────────────────────

networks:
  tradedrift-prod-net:
    driver: bridge

volumes:
  postgres_data:
